{% extends "base.html" %}
{% block titulo %}Fuentes de financiamiento{% endblock %}
{% block contenido %}
<h1>Fuentes de financiamiento</h1>
<table>
  <thead><tr><th>Código</th><th>Denominación</th></tr></thead>
  <tbody>
  {% for f in lista %}<tr><td class="codigo">{{ f.codigo }}</td><td>{{ f.denominacion }}</td></tr>{% endfor %}
  </tbody>
</table>
{% if usuario.rol == 'admin' %}
<h2>Agregar fuente</h2>
<form method="post" action="/fuentes" class="en-linea">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Código <input name="codigo" maxlength="10" required></label>
  <label>Denominación <input name="denominacion" required></label>
  <button>Agregar</button>
</form>
{% endif %}
{% endblock %}
