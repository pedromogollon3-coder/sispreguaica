{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block publico %}
<main class="entrar">
  <form method="post" action="/entrar" class="tarjeta">
    <span class="logo"><span class="logo-s">S</span><span><b>Sispreguaica</b><small>Presupuesto de gastos e ingresos</small></span></span>
    <p class="sutil">{{ ente }}</p>
    {% for tipo, texto in avisos %}<div class="aviso {{ tipo }}" role="status">{{ texto }}</div>{% endfor %}
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Usuario <input name="login" autocomplete="username" required autofocus></label>
    <label>Clave <input name="clave" type="password" autocomplete="current-password" required></label>
    <button>Entrar</button>
  </form>
</main>
{% endblock %}
